name: CI

# Pull requests run this directly. Pushes to main and develop run it through release.yml and beta.yml,
# so each push gets one workflow run that tests first and only then packages.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  # In a called workflow, github.workflow is the caller's name, so Release and Beta runs don't cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    name: Extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Integration tests (VS Code)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        if: runner.os == 'Linux'
        run: npm run package

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vsix-${{ github.sha }}
          path: vscode-extension/*.vsix
          retention-days: 14

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      # The tests run the backend under plain Node; the Electron binary isn't needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
