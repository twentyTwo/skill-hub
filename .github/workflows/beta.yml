name: Beta

# Every push to develop is tested and, if the extension changed, packaged as <version>-beta.<run> and attached
# to a GitHub pre-release. Betas are not sent to the marketplaces.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: beta
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  beta:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for extension changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null || BEFORE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" HEAD -- . ':(exclude)*.md' | head -1)
          echo "changed=$([ -n "$CHANGED" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -n "$CHANGED" ] || echo "::notice::Only docs or non-extension files changed; no beta built."

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Package beta VSIX
        id: build
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          BASE=$(node -p "require('./package.json').version")
          VERSION="$BASE-beta.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version
          npm run package -- --pre-release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$(node -p "require('./package.json').name")-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: steps.changes.outputs.changed == 'true'
        with:
          tag_name: v${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Beta v${{ steps.build.outputs.version }}
          prerelease: true
          files: vscode-extension/${{ steps.build.outputs.vsix }}
          body: |
            Pre-release build from `develop` (${{ github.sha }}). It may have bugs.

            To install: download `${{ steps.build.outputs.vsix }}`, then in VS Code run **Extensions: Install from VSIX…**.
            Report problems in [Issues](https://github.com/${{ github.repository }}/issues).
