name: Feature request
description: Suggest a new feature, a new agent target or a source Skill Hub should support.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine it working in Skill Hub.
  - type: dropdown
    id: app
    attributes:
      label: App
      multiple: true
      options:
        - VS Code extension
        - Desktop app
